{% extends "base.html" %}
{% block title %}Upload CSV — ReportDrop{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-gray-900 mb-8">Create New Report</h1>
    <form method="POST" action="/upload" enctype="multipart/form-data" class="space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Report Title</label>
            <input type="text" name="title" required placeholder="e.g. Q1 Marketing Report"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Template</label>
            <select name="template_type"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
                <option value="general">General</option>
                <option value="marketing">Marketing</option>
                <option value="financial">Financial</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">CSV File</label>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-indigo-400 transition">
                <input type="file" name="file" accept=".csv,.tsv" required
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                <p class="text-sm text-gray-400 mt-2">CSV or TSV files supported</p>
            </div>
        </div>
        <button type="submit"
            class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition">
            Generate Report
        </button>
    </form>
</div>
{% endblock %}
